<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img">
<style>.s{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}.r{font-family:ui-serif, 'New York', 'Iowan Old Style', Charter, Georgia, 'Times New Roman', serif}.m{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace}.p{white-space:pre}</style>
<defs>
  <linearGradient id="teal" x1="0.25" y1="0.07" x2="0.75" y2="0.93">
    <stop offset="0" stop-color="#173333"/><stop offset="1" stop-color="#337570"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.07"/>
  </filter>
  <filter id="pillshadow" x="-30%" y="-60%" width="160%" height="260%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.28"/>
  </filter>
  
</defs>
<rect width="1280" height="760" rx="28" fill="#F4F2EE"/><rect x="0.5" y="0.5" width="1279" height="759" rx="27.5" fill="none" stroke="#000000" stroke-opacity="0.06"/>
<path d="M62 50 L56 56 L62 62" fill="none" stroke="#2F6965" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="61" class="s" font-size="15" fill="#2F6965">All notes</text>
<text x="56" y="118" class="r" font-size="40" fill="#1F1E1C">Launch sync</text>
<text x="56" y="150" class="s" font-size="16" fill="#6F6B65">Oct 1 at 10:00 AM · 32 min · with Priya, Tamaro, Sam</text>
<rect x="1062" y="92" width="162" height="36" rx="10" fill="#EDEAE4" stroke="#000000" stroke-opacity="0.08"/>
<text x="1143" y="115.5" text-anchor="middle" class="s" font-size="15" font-weight="500" fill="#1F1E1C">Copy as Markdown</text>
<text x="56" y="196" class="s" font-size="13" font-weight="600" letter-spacing="1.4" fill="#6F6B65">SUMMARY</text>
<rect x="56" y="210" width="700" height="150" rx="14" fill="#FDFDFC"/><rect x="56.5" y="210.5" width="699" height="149" rx="13.5" fill="none" stroke="#000000" stroke-opacity="0.08"/>
<text x="80" y="254" class="s" font-size="17" fill="#9A968F">•</text>
<text x="100" y="254" class="s" font-size="17" fill="#1F1E1C">The beta build is ready; the onboarding copy is the last open item.</text>
<text x="80" y="290" class="s" font-size="17" fill="#9A968F">•</text>
<text x="100" y="290" class="s" font-size="17" fill="#1F1E1C">Support wants a help page live before the launch email goes out.</text>
<text x="80" y="326" class="s" font-size="17" fill="#9A968F">•</text>
<text x="100" y="326" class="s" font-size="17" fill="#1F1E1C">Testers mostly asked for a shortcuts cheat sheet.</text>
<text x="56" y="390" class="s" font-size="13" font-weight="600" letter-spacing="1.4" fill="#6F6B65">DECISIONS</text>
<rect x="56" y="404" width="700" height="114" rx="14" fill="#FDFDFC"/><rect x="56.5" y="404.5" width="699" height="113" rx="13.5" fill="none" stroke="#000000" stroke-opacity="0.08"/>
<text x="80" y="448" class="s" font-size="17" fill="#9A968F">•</text>
<text x="100" y="448" class="s" font-size="17" fill="#1F1E1C">Move the launch to Thursday.</text>
<text x="80" y="484" class="s" font-size="17" fill="#9A968F">•</text>
<text x="100" y="484" class="s" font-size="17" fill="#1F1E1C">Add the cheat sheet to the help page, not the app.</text>
<text x="56" y="548" class="s" font-size="13" font-weight="600" letter-spacing="1.4" fill="#6F6B65">ACTION ITEMS</text>
<rect x="56" y="562" width="700" height="150" rx="14" fill="#FDFDFC"/><rect x="56.5" y="562.5" width="699" height="149" rx="13.5" fill="none" stroke="#000000" stroke-opacity="0.08"/>
<rect x="78" y="592" width="15" height="15" rx="4" fill="none" stroke="#9A968F" stroke-width="1.6"/>
<text x="106" y="606" class="s" font-size="17" fill="#1F1E1C">Priya: final onboarding copy by Tuesday</text>
<rect x="78" y="628" width="15" height="15" rx="4" fill="none" stroke="#9A968F" stroke-width="1.6"/>
<text x="106" y="642" class="s" font-size="17" fill="#1F1E1C">Tamaro: draft the help page</text>
<rect x="78" y="664" width="15" height="15" rx="4" fill="none" stroke="#9A968F" stroke-width="1.6"/>
<text x="106" y="678" class="s" font-size="17" fill="#1F1E1C">Sam: schedule the launch email for Thursday</text>
<text x="784" y="196" class="s" font-size="13" font-weight="600" letter-spacing="1.4" fill="#6F6B65">TRANSCRIPT</text>
<rect x="784" y="210" width="440" height="342" rx="14" fill="#FDFDFC"/><rect x="784.5" y="210.5" width="439" height="341" rx="13.5" fill="none" stroke="#000000" stroke-opacity="0.08"/>
<text x="806" y="250" class="s" font-size="14" font-weight="600" fill="#2F6965">You</text>
<text x="806" y="270" class="s" font-size="13" fill="#6F6B65" style="font-variant-numeric:tabular-nums">0:04</text>
<text x="880" y="250" class="s" font-size="16" fill="#1F1E1C">Quick launch check. Where are we on the</text>
<text x="880" y="273" class="s" font-size="16" fill="#1F1E1C">beta?</text>
<text x="806" y="312" class="s" font-size="14" font-weight="600" fill="#1F1E1C">Others</text>
<text x="806" y="332" class="s" font-size="13" fill="#6F6B65" style="font-variant-numeric:tabular-nums">0:11</text>
<text x="880" y="312" class="s" font-size="16" fill="#1F1E1C">The build is ready. The only open item is the</text>
<text x="880" y="335" class="s" font-size="16" fill="#1F1E1C">onboarding copy.</text>
<text x="806" y="374" class="s" font-size="14" font-weight="600" fill="#2F6965">You</text>
<text x="806" y="394" class="s" font-size="13" fill="#6F6B65" style="font-variant-numeric:tabular-nums">0:26</text>
<text x="880" y="374" class="s" font-size="16" fill="#1F1E1C">Great. Can we still make Wednesday?</text>
<text x="806" y="436" class="s" font-size="14" font-weight="600" fill="#1F1E1C">Others</text>
<text x="806" y="456" class="s" font-size="13" fill="#6F6B65" style="font-variant-numeric:tabular-nums">0:34</text>
<text x="880" y="436" class="s" font-size="16" fill="#1F1E1C">Support needs a help page first, so</text>
<text x="880" y="459" class="s" font-size="16" fill="#1F1E1C">Thursday is safer.</text>
<text x="806" y="498" class="s" font-size="14" font-weight="600" fill="#2F6965">You</text>
<text x="806" y="518" class="s" font-size="13" fill="#6F6B65" style="font-variant-numeric:tabular-nums">0:47</text>
<text x="880" y="498" class="s" font-size="16" fill="#1F1E1C">Thursday it is. Tamaro, can you draft the</text>
<text x="880" y="521" class="s" font-size="16" fill="#1F1E1C">help page?</text>
<g transform="translate(786 583) scale(0.85)"><path d="M3.5 6.5 V4.8 A3.5 3.5 0 0 1 10.5 4.8 V6.5" fill="none" stroke="#9A968F" stroke-width="1.7"/><rect x="1.5" y="6.5" width="11" height="8.5" rx="2" fill="#9A968F"/></g>
<text x="806" y="596" class="s" font-size="14" fill="#6F6B65">Transcribed and summarized on this Mac.</text>
<text x="806" y="618" class="s" font-size="14" fill="#6F6B65">Nothing joins the call.</text>
</svg>
